name: Mirror release to Gitee

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-gitee-release.yml'
      - '.github/scripts/sync-gitee-*.sh'
  release:
    types: [published]
  schedule:
    # A fork does not receive upstream release events, so poll the source hourly.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mirror, or latest'
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: mirror-gitee-release-v3
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      assets: ${{ steps.release.outputs.assets }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_GITHUB_REPOSITORY: iOfficeAI/OfficeCLI
      GITEE_OWNER: yeholdon
      GITEE_REPO: OfficeCLI
    steps:
      - name: Check out mirror tooling
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            tag="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag=latest
          fi
          if [ "$tag" = latest ]; then
            tag="$(gh api "repos/$SOURCE_GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          fi
          assets="$(
            gh api "repos/$SOURCE_GITHUB_REPOSITORY/releases/tags/$tag" |
              jq -c '[.assets[].name | select(. != "SHA256SUMS")]'
          )"
          if [ "$assets" = '[]' ]; then
            echo 'No binary release assets were found.' >&2
            exit 1
          fi
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Mirror release tag to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: yeholdon
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash .github/scripts/sync-gitee-tag.sh "$RELEASE_TAG"

      - name: Create release and mirror checksum manifest
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash .github/scripts/sync-gitee-release.sh "$RELEASE_TAG" SHA256SUMS

  mirror-assets:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        asset: ${{ fromJSON(needs.prepare.outputs.assets) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_GITHUB_REPOSITORY: iOfficeAI/OfficeCLI
      GITEE_OWNER: yeholdon
      GITEE_REPO: OfficeCLI
    steps:
      - name: Check out mirror tooling
        uses: actions/checkout@v5

      - name: Mirror and verify ${{ matrix.asset }}
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_ASSET: ${{ matrix.asset }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: bash .github/scripts/sync-gitee-release.sh "$RELEASE_TAG" "$RELEASE_ASSET"

  verify:
    needs: [prepare, mirror-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_GITHUB_REPOSITORY: iOfficeAI/OfficeCLI
      GITEE_OWNER: yeholdon
      GITEE_REPO: OfficeCLI
    steps:
      - name: Check out mirror tooling
        uses: actions/checkout@v5

      - name: Verify complete Gitee release
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: bash .github/scripts/sync-gitee-release.sh "$RELEASE_TAG"
